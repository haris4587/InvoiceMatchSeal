name: Verify contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-v0.2.16-tools-0.11.0
      - name: Install tools
        run: python -m pip install -r requirements-dev.txt
      - name: SDK validation
        run: genvm-lint check contracts/invoice_match_seal.py
      - name: Type checking
        run: genvm-lint typecheck contracts/invoice_match_seal.py
      - name: Contract and adversarial validator tests
        run: pytest
      - name: Regenerate and verify mocked receipt
        run: python scripts/offline_demo.py
      - name: ABI matches source
        run: |
          genvm-lint schema contracts/invoice_match_seal.py --output /tmp/abi.json
          python -c "import json; assert json.load(open('/tmp/abi.json')) == json.load(open('docs/abi.json'))"
